[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcbd-har"
version = "0.1.0"
description = "Role-Canonical Bilateral Decomposition for wearable HAR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "antropy>=0.1.9",
  "catboost>=1.2.8",
  "numba>=0.57",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
audio = ["h5py>=3.9", "torchaudio>=2.1"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
